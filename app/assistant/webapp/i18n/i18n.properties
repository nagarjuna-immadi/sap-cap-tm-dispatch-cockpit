# This is the resource bundle for tm.dispatch.assistant

#Texts for manifest.json

#XTIT: Application name
appTitle=TM Assistant

#YDES: Application description
appDescription=Chat with the dispatch and tender agents. Every change needs your approval.

#XTIT: Launchpad tile subtitle
flpSubtitle=Tender and quote by chat

#Texts for the chat page

#XTIT: Agent picker item, dispatch agent (Dispatcher role)
agentDispatch=Dispatch

#XTIT: Agent picker item, tender agent (CarrierDesk role)
agentTender=Tender Desk

#XBUT: Starts a new conversation with the current agent
newConversation=New Conversation

#XFLD: Placeholder of the message input; {0} is the agent name
inputPlaceholder=Message {0}… (Enter to send, Shift+Enter for a new line)

#XBUT: Sends the message
send=Send

#XBUT: Stops the running answer
stop=Stop

#XTIT: Shown above the suggestion buttons of an empty conversation
suggestions=Try asking

#XTIT: Approval card title; {0} is the action name
approvalTitle=Approval needed: {0}

#XMSG: Approval card text when the agent gave no description
approvalText=The agent wants to run this action. Nothing is changed until you approve it.

#XBUT: Approve the pending action
approve=Approve

#XBUT: Reject the pending action
reject=Reject

#XMSG: Shown in the chat after the user approved an action; {0} is the action name
approved=Approved: {0}

#XMSG: Shown in the chat after the user rejected an action; {0} is the action name
rejected=Rejected: {0}

#XMSG: Sent to the agent as the reason of a rejection
rejectReason=The user rejected the action in TM Assistant.

#XMSG: Busy text while the agent is working
thinking=Working…

#XMSG: The agent finished without text
noAnswer=(no answer)

#XMSG: The answer was stopped by the user
canceled=Stopped.

#XMSG: The task failed; {0} is the error text
failed=The agent could not finish: {0}

#XTIT: No agent available for the user
noAgentTitle=No assistant available

#XMSG: No agent available for the user
noAgentText=TM Assistant needs the Dispatcher or the Carrier Desk role.

#XMSG: Agent cards are loading
loadingAgents=Loading assistants…
