_schema-version: 3.3.0
ID: sap-cap-tm-dispatch-cockpit
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: sap-cap-tm-dispatch-cockpit-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: sap-cap-tm-dispatch-cockpit-auth
      - name: sap-cap-tm-dispatch-cockpit-db
      - name: sap-cap-tm-dispatch-cockpit-destination

  - name: sap-cap-tm-dispatch-cockpit-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: sap-cap-tm-dispatch-cockpit-db

  - name: sap-cap-tm-dispatch-cockpit-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: sapcaptmdispatchcockpitdispatchcockpit
          artifacts:
            - dispatch-cockpit.zip
          target-path: app/
        - name: sapcaptmdispatchcockpittenderdesk
          artifacts:
            - tender-desk.zip
          target-path: app/
    requires:
      - name: sap-cap-tm-dispatch-cockpit-auth
      - name: srv-api
      - name: sap-cap-tm-dispatch-cockpit-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: sapcaptmdispatchcockpitdispatchcockpit
    type: html5
    path: app/dispatch-cockpit
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: sapcaptmdispatchcockpittenderdesk
    type: html5
    path: app/tender-desk
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: sap-cap-tm-dispatch-cockpit
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sap-cap-tm-dispatch-cockpit-auth
      - name: sap-cap-tm-dispatch-cockpit-destination
      - name: sap-cap-tm-dispatch-cockpit-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: sap-cap-tm-dispatch-cockpit-destinations
    type: com.sap.application.content
    requires:
      - name: sap-cap-tm-dispatch-cockpit-auth
        parameters:
          service-key:
            name: sap-cap-tm-dispatch-cockpit-auth-key
      - name: sap-cap-tm-dispatch-cockpit-html5-repo-host
        parameters:
          service-key:
            name: sap-cap-tm-dispatch-cockpit-html5-repo-host-key
      - name: srv-api
      - name: sap-cap-tm-dispatch-cockpit-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        subaccount: # Work Zone's HTML5 Apps provider only reads subaccount-level destinations
          existing_destinations_policy: update
          destinations:
            - Name: sap-cap-tm-dispatch-cockpit-html5-repository
              ServiceInstanceName: sap-cap-tm-dispatch-cockpit-html5-repo-host
              ServiceKeyName: sap-cap-tm-dispatch-cockpit-html5-repo-host-key
              sap.cloud.service: sapcaptmdispatchcockpit.service
            - Name: sap-cap-tm-dispatch-cockpit-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: sap-cap-tm-dispatch-cockpit-auth
              ServiceKeyName: sap-cap-tm-dispatch-cockpit-auth-key
              sap.cloud.service: sapcaptmdispatchcockpit.service

resources:
  - name: sap-cap-tm-dispatch-cockpit-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-cap-tm-dispatch-cockpit-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: sap-cap-tm-dispatch-cockpit-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: sap-cap-tm-dispatch-cockpit-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: sap-cap-tm-dispatch-cockpit-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: sap-cap-tm-dispatch-cockpit-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
